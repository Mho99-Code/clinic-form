<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الاستقبال - White Smile </title>
    <style>
        * { 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        body { 
            background-color: #f0f4f8; 
            padding: 20px; 
            margin: 0; 
        }
        .container { 
            max-width: 600px; 
            background: #ffffff; 
            margin: 30px auto; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        .logo-wrap {
            text-align: center;
            margin-bottom: 10px;
        }
        .logo-wrap .tooth {
            font-size: 42px;
            line-height: 1;
        }
        .clinic-name {
            text-align: center;
            color: #00d9a0 ;
            font-weight: bold;
            font-size: 50px;
            margin-bottom: 30px;
        }
        h2 { 
            color: #1a365d; 
            text-align: center; 
            margin-bottom: 20px; 
            font-size: 20px;
        }
        .form-group { 
            margin-bottom: 15px; 
        }
        label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: bold; 
            color: #2d3748; 
            font-size: 15px;
        }
        input, select, textarea { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #cbd5e0; 
            border-radius: 6px; 
            font-size: 16px; 
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background-color:#00d9a0; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 17px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s; 
        }
        button:hover { 
            background-color: #00d9a0; 
        }
        button:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
        }
        .status { 
            margin-top: 15px; 
            padding: 10px; 
            border-radius: 6px; 
            display: none; 
            text-align: center; 
            font-weight: bold; 
        }
        .success { 
            background-color: #c6f6d5; 
            color: #22543d; 
        }
        .error { 
            background-color: #fed7d7; 
            color: #742a2a; 
        }
        .info { 
            background-color: #bee3f8; 
            color: #2a4365; 
        }
        .recovered-banner {
            background-color: #fefcbf;
            color: #744210;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
            text-align: center;
        }
        .recovered-banner button {
            margin-top: 8px;
            width: auto;
            padding: 6px 14px;
            font-size: 14px;
            display: inline-block;
        }

        /* شاشات صغيرة / تليفون: خط أكبر شوية لسهولة القراءة */
        @media (max-width: 480px) {
            body { padding: 10px; }
            .container { padding: 18px; margin: 15px auto; }
            h2 { font-size: 19px; }
            label { font-size: 16px; }
            input, select, textarea { font-size: 17px; padding: 13px; }
            button { font-size: 18px; padding: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-wrap"><span class="tooth"></span></div>
    <div class="clinic-name">White Smile </div>
    <h2>تسجيل مريض جديد - الاستقبال</h2>

    <div id="recoveredBanner" class="recovered-banner">
        ⚠️ فيه بيانات محفوظة من محاولة إرسال سابقة لم تكتمل. تقدر تسترجعها أو تبدأ من جديد.
        <br>
        <button type="button" id="restoreBtn">استرجاع البيانات</button>
        <button type="button" id="discardBtn" style="background:#a0aec0;">تجاهل</button>
    </div>

    <form id="patientForm">
        <div class="form-group">
            <label>اسم المريض الكامل:</label>
            <input type="text" id="patient_name" required placeholder="مثال: أحمد محمد علي">
        </div>

        <div class="form-group">
            <label>رقم الهاتف:</label>
            <input type="tel" id="patient_phone" required placeholder="09xxxxxxx">
        </div>

        <div class="form-group">
            <label>الرقم القومي / رقم ملف المريض:</label>
            <input type="text" id="national_id" placeholder="اختياري - لو المريض عنده ملف بالفعل">
        </div>

        <div class="form-group">
            <label>اختيار الطبيب المعالج:</label>
            <select id="doctor_id" required>
                <option value="">-- اختر الدكتور --</option>
                <option value="dr_ahmed">د. عثمان هشام عثمان (تقويم أسنان)</option>
                <option value="dr_sara">د. سارة (حشو وجذور)</option>
                <option value="dr_omda">د. عماد  (جراحة وزراعة)</option>
            </select>
        </div>

        <div class="form-group">
            <label>نوع الزيارة:</label>
            <select id="visit_type" required>
                <option value="">-- اختر نوع الزيارة --</option>
                <option value="كشف أول مرة">كشف أول مرة</option>
                <option value="متابعة">متابعة</option>
                <option value="طوارئ">طوارئ</option>
            </select>
        </div>

        <div class="form-group">
            <label>نوع الإجراء المطلوب:</label>
            <select id="procedure_type">
                <option value="">-- اختر الإجراء (اختياري) --</option>
                <option value="تنظيف">تنظيف</option>
                <option value="حشو">حشو</option>
                <option value="خلع">خلع</option>
                <option value="تركيب">تركيب</option>
                <option value="تقويم">تقويم</option>
                <option value="أخرى">أخرى (اذكرها في الملاحظات)</option>
            </select>
        </div>

        <div class="form-group">
            <label>تاريخ ووقت الموعد:</label>
            <input type="datetime-local" id="appointment_time">
        </div>

        <div class="form-group">
            <label>المبلغ المدفوع (جنيه):</label>
            <input type="number" id="amount_paid" required placeholder="0.00" step="0.01">
        </div>

        <div class="form-group">
            <label>ملاحظات طبية / الشكوى:</label>
            <textarea id="medical_notes" rows="3" placeholder="مثال: يعاني من ألم في الضرس العلوي  ..."></textarea>
        </div>

        <button type="submit" id="submitBtn">حفظ وإرسال التنبيه للدكتور</button>
    </form>

    <div id="statusMessage" class="status"></div>
</div>

<script>
    // 🔗 رابط Google Apps Script (بديل مجاني ودائم عن n8n + ngrok)
    // ⚠️ بعد ما تعمل Deploy للسكريبت (Code.gs)، هتاخد رابط شكله:
    //     https://script.google.com/macros/s/XXXXXXXXXXXX/exec
    // الصقه هنا بدل الرابط ده:
    const N8N_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbwaJU3q_zr1npQ4Z-X9Op_zSNNzvmFH5vQf9d_iDZgI1pfB3Ag7IiHSQAocX5gag6aA/exec';

    const DRAFT_KEY = 'dental_form_draft_v1';
    const form = document.getElementById('patientForm');
    const fieldIds = [
        'patient_name', 'patient_phone', 'national_id', 'doctor_id',
        'visit_type', 'procedure_type', 'appointment_time',
        'amount_paid', 'medical_notes'
    ];

    // ---------- استرجاع مسودة محفوظة محلياً (لو فيه اتصال اتقطع قبل كده) ----------
    function getSavedDraft() {
        try {
            const raw = localStorage.getItem(DRAFT_KEY);
            return raw ? JSON.parse(raw) : null;
        } catch (e) {
            return null;
        }
    }

    function saveDraft() {
        const draft = {};
        fieldIds.forEach(id => {
            draft[id] = document.getElementById(id).value;
        });
        try {
            localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
        } catch (e) { /* تجاهل لو التخزين مش متاح */ }
    }

    function clearDraft() {
        try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    }

    function applyDraft(draft) {
        fieldIds.forEach(id => {
            if (draft[id] !== undefined) {
                document.getElementById(id).value = draft[id];
            }
        });
    }

    const savedDraft = getSavedDraft();
    if (savedDraft) {
        document.getElementById('recoveredBanner').style.display = 'block';
    }
    document.getElementById('restoreBtn').addEventListener('click', function () {
        if (savedDraft) applyDraft(savedDraft);
        document.getElementById('recoveredBanner').style.display = 'none';
    });
    document.getElementById('discardBtn').addEventListener('click', function () {
        clearDraft();
        document.getElementById('recoveredBanner').style.display = 'none';
    });

    // ---------- إرسال الفورم ----------
    form.addEventListener('submit', async function (e) {
        e.preventDefault();

        const btn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('statusMessage');

        btn.disabled = true;
        btn.innerText = 'جاري الإرسال...';
        statusDiv.style.display = 'none';

        const payload = {
            patient_name: document.getElementById('patient_name').value,
            patient_phone: document.getElementById('patient_phone').value,
            national_id: document.getElementById('national_id').value || 'لا يوجد',
            doctor_id: document.getElementById('doctor_id').value,
            doctor_name: document.getElementById('doctor_id').options[document.getElementById('doctor_id').selectedIndex].text,
            visit_type: document.getElementById('visit_type').value,
            procedure_type: document.getElementById('procedure_type').value || 'غير محدد',
            appointment_time: document.getElementById('appointment_time').value || 'غير محدد',
            amount_paid: document.getElementById('amount_paid').value,
            medical_notes: document.getElementById('medical_notes').value || 'لا يوجد',
            timestamp: new Date().toISOString()
        };

        // نحفظ نسخة مؤقتة محلياً الأول، ونمسحها بس لو الإرسال نجح فعلاً
        saveDraft();

        try {
            // ملاحظة: بنستخدم text/plain بدل application/json عشان Google Apps Script
            // مش بيدعم طلبات الـ CORS "preflight" اللي بيبعتها المتصفح تلقائيًا مع application/json.
            // السكريبت في جوجل بيقرأ الداتا كـ JSON عادي زي ما هي برضه.
            const response = await fetch(N8N_WEBHOOK_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                statusDiv.className = 'status success';
                statusDiv.innerText = '✅ تم إرسال البيانات واستدعاء الدكتور بنجاح!';
                statusDiv.style.display = 'block';
                form.reset();
                clearDraft();
                document.getElementById('recoveredBanner').style.display = 'none';
            } else {
                statusDiv.className = 'status error';
                statusDiv.innerText = `❌ خطأ في الاستجابة (${response.status}): تأكد أن الـ Workflow مفعل (Active) في n8n.`;
                statusDiv.style.display = 'block';
            }
        } catch (error) {
            console.error('Fetch Error:', error);
            statusDiv.className = 'status error';
            statusDiv.innerText = '❌ تعذر الاتصال بالسيرفر! البيانات محفوظة عندك مؤقتاً ومش هتضيع - جرب تاني بعد شوية.';
            statusDiv.style.display = 'block';
        } finally {
            btn.disabled = false;
            btn.innerText = 'حفظ وإرسال التنبيه للدكتور';
        }
    });
</script>

</body>
</html>
