<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الاستقبال - عيادة الأسنان</title>
    <style>
        * { 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        body { 
            background-color: #f0f4f8; 
            padding: 20px; 
            margin: 0; 
        }
        .container { 
            max-width: 600px; 
            background: #ffffff; 
            margin: 30px auto; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        .logo-wrap {
            text-align: center;
            margin-bottom: 10px;
        }
        .logo-wrap .tooth {
            font-size: 42px;
            line-height: 1;
        }
        .clinic-name {
            text-align: center;
            color: #2b6cb0;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 15px;
        }
        h2 { 
            color: #1a365d; 
            text-align: center; 
            margin-bottom: 20px; 
            font-size: 20px;
        }
        .form-group { 
            margin-bottom: 15px; 
        }
        label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: bold; 
            color: #2d3748; 
            font-size: 15px;
        }
        input, select, textarea { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #cbd5e0; 
            border-radius: 6px; 
            font-size: 16px; 
        }
        select:disabled { background:#edf2f7; color:#718096; }
        button { 
            width: 100%; 
            padding: 14px; 
            background-color: #2b6cb0; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 17px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s; 
        }
        button:hover { 
            background-color: #2c5282; 
        }
        button:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
        }
        .status { 
            margin-top: 15px; 
            padding: 10px; 
            border-radius: 6px; 
            display: none; 
            text-align: center; 
            font-weight: bold; 
        }
        .success { 
            background-color: #c6f6d5; 
            color: #22543d; 
        }
        .error { 
            background-color: #fed7d7; 
            color: #742a2a; 
        }
        .info { 
            background-color: #bee3f8; 
            color: #2a4365; 
        }
        .recovered-banner {
            background-color: #fefcbf;
            color: #744210;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
            text-align: center;
        }
        .recovered-banner button {
            margin-top: 8px;
            width: auto;
            padding: 6px 14px;
            font-size: 14px;
            display: inline-block;
        }

        /* شاشات صغيرة / تليفون: خط أكبر شوية لسهولة القراءة */
        @media (max-width: 480px) {
            body { padding: 10px; }
            .container { padding: 18px; margin: 15px auto; }
            h2 { font-size: 19px; }
            label { font-size: 16px; }
            input, select, textarea { font-size: 17px; padding: 13px; }
            button { font-size: 18px; padding: 15px; }
        }

        /* ---------- شاشة الإيصال ---------- */
        .receipt-overlay {
            display: none;
            position: fixed; inset: 0; background: rgba(26,54,93,0.55);
            align-items: center; justify-content: center; padding: 16px; z-index: 100;
        }
        .receipt-card {
            background: #fff; border-radius: 14px; max-width: 380px; width: 100%;
            max-height: 90vh; overflow-y: auto; padding: 22px 20px;
        }
        .receipt-head { text-align: center; margin-bottom: 14px; }
        .receipt-head .tooth { font-size: 34px; line-height: 1; }
        .receipt-head .clinic { color: #2b6cb0; font-weight: bold; font-size: 14px; margin-top: 4px; }
        .receipt-head .kind { font-size: 12.5px; color: #718096; margin-top: 2px; }
        .receipt-number {
            text-align: center; font-family: monospace; font-size: 17px; font-weight: bold;
            background: #ebf8ff; color: #2c5282; border-radius: 8px; padding: 8px; margin: 12px 0 16px;
            letter-spacing: 1px;
        }
        .receipt-rows { font-size: 14px; line-height: 2.1; border-top: 1px dashed #cbd5e0; border-bottom: 1px dashed #cbd5e0; padding: 10px 0; margin-bottom: 14px; }
        .receipt-rows .r { display: flex; justify-content: space-between; gap: 10px; }
        .receipt-rows .r b { color: #1a365d; }
        .receipt-amount { text-align: center; font-size: 22px; font-weight: bold; color: #22543d; margin-bottom: 14px; }
        .receipt-amount span { font-size: 13px; color: #4a5568; display: block; font-weight: normal; margin-bottom: 2px; }
        .receipt-qr { text-align: center; margin-bottom: 6px; }
        .receipt-qr img { width: 130px; height: 130px; }
        .receipt-qr p { font-size: 11px; color: #a0aec0; margin: 4px 0 0; }
        .receipt-actions { display: flex; gap: 10px; margin-top: 16px; }
        .receipt-actions button { padding: 12px; font-size: 14.5px; }
        .receipt-actions .btn-secondary { background: #a0aec0; }

        /* ---------- تنسيق الطباعة (58mm ورق طابعة إيصالات حرارية) ---------- */
        @media print {
            @page { size: 58mm auto; margin: 2mm; }
            body * { visibility: hidden; }
            #receiptPrintArea, #receiptPrintArea * { visibility: visible; }
            #receiptPrintArea {
                position: absolute; top: 0; left: 0; width: 54mm;
                font-family: 'Segoe UI', Tahoma, sans-serif; font-size: 10.5px; color: #000;
            }
            #receiptPrintArea .receipt-qr img { width: 90px; height: 90px; }
            #receiptPrintArea .receipt-number { background: none; padding: 4px 0; font-size: 13px; }
            #receiptPrintArea .receipt-amount { font-size: 15px; }
            .receipt-actions { display: none !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-wrap"><span class="tooth">🦷</span></div>
    <div class="clinic-name">عيادة الأسنان</div>
    <h2>تسجيل مريض جديد - الاستقبال</h2>

    <div id="recoveredBanner" class="recovered-banner">
        ⚠️ فيه بيانات محفوظة من محاولة إرسال سابقة لم تكتمل. تقدر تسترجعها أو تبدأ من جديد.
        <br>
        <button type="button" id="restoreBtn">استرجاع البيانات</button>
        <button type="button" id="discardBtn" style="background:#a0aec0;">تجاهل</button>
    </div>

    <form id="patientForm">
        <div class="form-group">
            <label>اسم المريض الكامل:</label>
            <input type="text" id="patient_name" required placeholder="مثال: أحمد محمد علي">
        </div>

        <div class="form-group">
            <label>رقم الهاتف:</label>
            <input type="tel" id="patient_phone" required placeholder="09xxxxxxx">
        </div>

        <div class="form-group">
            <label>الرقم القومي / رقم ملف المريض:</label>
            <input type="text" id="national_id" placeholder="اختياري - لو المريض عنده ملف بالفعل">
        </div>

        <div class="form-group">
            <label>اختيار الطبيب المعالج:</label>
            <select id="doctor_id" required disabled>
                <option value="">-- جاري تحميل قائمة الأطباء... --</option>
            </select>
        </div>

        <div class="form-group">
            <label>نوع الزيارة:</label>
            <select id="visit_type" required>
                <option value="">-- اختر نوع الزيارة --</option>
                <option value="كشف أول مرة">كشف أول مرة</option>
                <option value="متابعة">متابعة</option>
                <option value="طوارئ">طوارئ</option>
            </select>
        </div>

        <div class="form-group">
            <label>نوع الإجراء المطلوب:</label>
            <select id="procedure_type">
                <option value="">-- اختر الإجراء (اختياري) --</option>
                <option value="تنظيف">تنظيف</option>
                <option value="حشو">حشو</option>
                <option value="خلع">خلع</option>
                <option value="تركيب">تركيب</option>
                <option value="تقويم">تقويم</option>
                <option value="أخرى">أخرى (اذكرها في الملاحظات)</option>
            </select>
        </div>

        <div class="form-group">
            <label>تاريخ ووقت الموعد:</label>
            <input type="datetime-local" id="appointment_time">
        </div>

        <div class="form-group">
            <label>المبلغ المدفوع (جنيه):</label>
            <input type="number" id="amount_paid" required placeholder="0.00" step="0.01">
        </div>

        <div class="form-group">
            <label>ملاحظات طبية / الشكوى:</label>
            <textarea id="medical_notes" rows="3" placeholder="مثال: يعاني من ألم في الضرس العلوي  ..."></textarea>
        </div>

        <button type="submit" id="submitBtn">حفظ وإرسال التنبيه للدكتور</button>
    </form>

    <div id="statusMessage" class="status"></div>
</div>

<!-- شاشة الإيصال - بتظهر بعد نجاح الحفظ -->
<div class="receipt-overlay" id="receiptOverlay">
  <div class="receipt-card">
    <div id="receiptPrintArea">
      <div class="receipt-head">
        <div class="tooth">🦷</div>
        <div class="clinic">White Smile — عيادة الأسنان</div>
        <div class="kind">إيصال استلام مبلغ</div>
      </div>
      <div class="receipt-number" id="rcNumber">WS-000000</div>
      <div class="receipt-rows">
        <div class="r"><span>المريض</span><b id="rcName">-</b></div>
        <div class="r"><span>الطبيب</span><b id="rcDoctor">-</b></div>
        <div class="r"><span>نوع الزيارة</span><b id="rcVisitType">-</b></div>
        <div class="r"><span>الإجراء</span><b id="rcProcedure">-</b></div>
        <div class="r"><span>التاريخ والوقت</span><b id="rcTime">-</b></div>
      </div>
      <div class="receipt-amount"><span>المبلغ المدفوع</span><span id="rcAmount">0 جنيه</span></div>
      <div class="receipt-qr">
        <img id="rcQr" src="" alt="QR تحقق من الإيصال">
        <p>امسح الكود للتأكد من صحة الإيصال</p>
      </div>
    </div>
    <div class="receipt-actions">
      <button type="button" id="rcPrintBtn">🖨️ طباعة</button>
      <button type="button" id="rcNewBtn" class="btn-secondary">مريض جديد</button>
    </div>
  </div>
</div>

<script>
    // 🔗 رابط Google Apps Script — نفس الرابط في فورم الحجز ولوحة الطبيب
    const N8N_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbwDVqknhSxzCxiklWLOs8Bj5UQxrkrGMT84Eowdj6J4otB_291yLkZcUq9eqwjprAAS/exec';
    // 🔗 رابط صفحة التحقق من الإيصال (لازم تكون مرفوعة على نفس الاستضافة) — عدّله لو غيّرت اسم الفولدر
    const VERIFY_PAGE_URL = 'https://mho99-code.github.io/clinic-form/verify.html';

    const DRAFT_KEY = 'dental_form_draft_v1';
    const form = document.getElementById('patientForm');
    const doctorSelect = document.getElementById('doctor_id');
    const fieldIds = [
        'patient_name', 'patient_phone', 'national_id', 'doctor_id',
        'visit_type', 'procedure_type', 'appointment_time',
        'amount_paid', 'medical_notes'
    ];

    // ---------- تحميل قائمة الأطباء من الشيت (بدل ما تكون ثابتة في الكود) ----------
    let pendingDraftDoctorValue = null;

    async function loadDoctors() {
        try {
            const url = new URL(N8N_WEBHOOK_URL);
            url.searchParams.set('action', 'doctors');
            const res = await fetch(url.toString());
            const json = await res.json();
            if (json.status !== 'ok' || !Array.isArray(json.data) || json.data.length === 0) {
                throw new Error(json.message || 'لا يوجد أطباء مسجلين');
            }
            doctorSelect.innerHTML = '<option value="">-- اختر الدكتور --</option>';
            json.data.forEach(doc => {
                const opt = document.createElement('option');
                opt.value = doc.key;
                opt.textContent = doc.label;
                doctorSelect.appendChild(opt);
            });
            doctorSelect.disabled = false;
            if (pendingDraftDoctorValue) {
                doctorSelect.value = pendingDraftDoctorValue;
            }
        } catch (err) {
            console.error(err);
            doctorSelect.innerHTML = '<option value="">⚠️ تعذر تحميل قائمة الأطباء - أعد تحميل الصفحة</option>';
        }
    }

    // ---------- استرجاع مسودة محفوظة محلياً (لو فيه اتصال اتقطع قبل كده) ----------
    function getSavedDraft() {
        try {
            const raw = localStorage.getItem(DRAFT_KEY);
            return raw ? JSON.parse(raw) : null;
        } catch (e) {
            return null;
        }
    }

    function saveDraft() {
        const draft = {};
        fieldIds.forEach(id => {
            draft[id] = document.getElementById(id).value;
        });
        try {
            localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
        } catch (e) { /* تجاهل لو التخزين مش متاح */ }
    }

    function clearDraft() {
        try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    }

    function applyDraft(draft) {
        fieldIds.forEach(id => {
            if (draft[id] !== undefined) {
                if (id === 'doctor_id') {
                    pendingDraftDoctorValue = draft[id]; // القايمة لسه بتتحمل غالبًا، فبنأجل التطبيق
                    if (!doctorSelect.disabled) doctorSelect.value = draft[id];
                } else {
                    document.getElementById(id).value = draft[id];
                }
            }
        });
    }

    const savedDraft = getSavedDraft();
    if (savedDraft) {
        document.getElementById('recoveredBanner').style.display = 'block';
    }
    document.getElementById('restoreBtn').addEventListener('click', function () {
        if (savedDraft) applyDraft(savedDraft);
        document.getElementById('recoveredBanner').style.display = 'none';
    });
    document.getElementById('discardBtn').addEventListener('click', function () {
        clearDraft();
        document.getElementById('recoveredBanner').style.display = 'none';
    });

    loadDoctors();

    // ---------- شاشة الإيصال ----------
    function showReceipt(payload, result) {
        const receiptNumber = result.receiptNumber || '—';
        document.getElementById('rcNumber').textContent = receiptNumber;
        document.getElementById('rcName').textContent = payload.patient_name || '-';
        document.getElementById('rcDoctor').textContent = payload.doctor_name || '-';
        document.getElementById('rcVisitType').textContent = payload.visit_type || '-';
        document.getElementById('rcProcedure').textContent = payload.procedure_type || 'غير محدد';
        document.getElementById('rcTime').textContent = result.receiptTime || new Date().toLocaleString('ar-EG');
        const amountNum = parseFloat(payload.amount_paid);
        document.getElementById('rcAmount').textContent = (isNaN(amountNum) ? payload.amount_paid : amountNum.toLocaleString('ar-EG')) + ' جنيه';

        if (receiptNumber && receiptNumber !== '—') {
            const verifyUrl = VERIFY_PAGE_URL + '?receipt=' + encodeURIComponent(receiptNumber);
            const qrSrc = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + encodeURIComponent(verifyUrl);
            document.getElementById('rcQr').src = qrSrc;
            document.getElementById('rcQr').style.display = 'inline-block';
        } else {
            document.getElementById('rcQr').style.display = 'none';
        }

        document.getElementById('receiptOverlay').style.display = 'flex';
    }

    document.getElementById('rcPrintBtn').addEventListener('click', () => window.print());
    document.getElementById('rcNewBtn').addEventListener('click', () => {
        document.getElementById('receiptOverlay').style.display = 'none';
        document.getElementById('patient_name').focus();
    });

    // ---------- إرسال الفورم ----------
    form.addEventListener('submit', async function (e) {
        e.preventDefault();

        const btn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('statusMessage');

        btn.disabled = true;
        btn.innerText = 'جاري الإرسال...';
        statusDiv.style.display = 'none';

        const payload = {
            form_type: 'reception',
            patient_name: document.getElementById('patient_name').value,
            patient_phone: document.getElementById('patient_phone').value,
            national_id: document.getElementById('national_id').value || 'لا يوجد',
            doctor_id: doctorSelect.value,
            doctor_name: doctorSelect.options[doctorSelect.selectedIndex].text,
            visit_type: document.getElementById('visit_type').value,
            procedure_type: document.getElementById('procedure_type').value || 'غير محدد',
            appointment_time: document.getElementById('appointment_time').value || 'غير محدد',
            amount_paid: document.getElementById('amount_paid').value,
            medical_notes: document.getElementById('medical_notes').value || 'لا يوجد',
            timestamp: new Date().toISOString()
        };

        // نحفظ نسخة مؤقتة محلياً الأول، ونمسحها بس لو الإرسال نجح فعلاً
        saveDraft();

        try {
            // ملاحظة: بنستخدم text/plain بدل application/json عشان Google Apps Script
            // مش بيدعم طلبات الـ CORS "preflight" اللي بيبعتها المتصفح تلقائيًا مع application/json.
            // السكريبت في جوجل بيقرأ الداتا كـ JSON عادي زي ما هي برضه.
            const response = await fetch(N8N_WEBHOOK_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: JSON.stringify(payload)
            });

            const resultText = await response.text();
            let result;
            try { result = JSON.parse(resultText); } catch (e) { result = null; }

            if (response.ok && result && result.status === 'ok') {
                statusDiv.className = 'status success';
                statusDiv.innerText = '✅ تم إرسال البيانات واستدعاء الدكتور بنجاح!';
                statusDiv.style.display = 'block';
                showReceipt(payload, result);
                form.reset();
                clearDraft();
                document.getElementById('recoveredBanner').style.display = 'none';
            } else {
                statusDiv.className = 'status error';
                statusDiv.innerText = '❌ الخادم رد بخطأ فعلي: ' + (result && result.message ? result.message : resultText);
                statusDiv.style.display = 'block';
            }
        } catch (error) {
            console.error('Fetch Error:', error);
            statusDiv.className = 'status error';
            statusDiv.innerText = '❌ تعذر الاتصال بالسيرفر! البيانات محفوظة عندك مؤقتاً ومش هتضيع - جرب تاني بعد شوية.';
            statusDiv.style.display = 'block';
        } finally {
            btn.disabled = false;
            btn.innerText = 'حفظ وإرسال التنبيه للدكتور';
        }
    });
</script>

</body>
</html>
